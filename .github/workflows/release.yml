name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-26 is GA and ships Xcode 26, which is what supplies the macOS 26 SDK
    # SignalDeck needs. macos-15 runners may carry an older SDK and fail the guard below.
    runs-on: macos-26
    steps:
      # Third-party actions are pinned to full commit SHAs, not tags. A tag is a mutable
      # ref: whoever controls the action's repo can move `v4` to point at anything, and
      # this job holds `contents: write` over the very zip users install via Homebrew.
      # A SHA is the only ref an upstream account compromise can't repoint.
      #
      # All three are on their node24 majors. Node 20 reached EOL in April 2026 and is
      # being removed from the runners in autumn 2026 — a node20 action pinned by SHA
      # can't float to a fix, so pinning the old majors would have frozen this workflow
      # into a runtime that stops existing. Re-resolve the SHA when bumping the comment:
      # softprops' tags are annotated, so `git/ref/tags/vX` gives the tag object and the
      # commit has to be read out of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is only needed to clone. Leaving it in .git/config afterwards means
          # every later step — including third-party ones — can read a credential able to
          # write this repo. Nothing here pushes; stamp-build.sh only reads local history.
          persist-credentials: false

      # SignalDeck compiles against macOS 26 APIs (CATapDescription.bundleIDs and
      # isProcessRestoreEnabled) behind `if #available`, so the *SDK* must be 26 or newer
      # even though the deployment target is 15.0. Pick the newest Xcode on the runner.
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $SDK"
          if [ "$(printf '%s\n26.0\n' "$SDK" | sort -V | head -1)" != "26.0" ]; then
            echo "::error::macOS SDK $SDK is too old — SignalDeck needs SDK 26.0+."
            echo "Check https://github.com/actions/runner-images for a runner with Xcode 26+,"
            echo "or build locally with ./package.sh."
            exit 1
          fi

      - name: Build universal app
        run: ./package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SignalDeck-app
          path: dist/*.zip

      # The zip is ad-hoc signed and NOT notarized — GitHub has no Developer ID certificate.
      # Anyone downloading it must clear the quarantine flag once; see the README.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          body: |
            Universal (Apple Silicon + Intel) build of SignalDeck.

            **This build is ad-hoc signed, not notarized.** macOS will refuse to open it
            on first launch. After downloading and unzipping:

            ```
            xattr -dr com.apple.quarantine /Applications/SignalDeck.app
            ```

            Then launch it and grant permission under
            System Settings → Privacy & Security → Screen & System Audio Recording.
